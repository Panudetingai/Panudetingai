name: Generate trophy

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: debug
        env:
          T: ${{ secrets.TROPHY_TOKEN }}
        run: |
          echo "workflow_ref = ${{ github.workflow_ref }}"
          echo "repo = ${{ github.repository }}"
          echo "token length = ${#T}"
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $T" https://api.github.com/user)
          echo "token check = $code (200 = valid)"

      - name: generate trophy.svg
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: ${{ github.repository_owner }}
          file: dist/trophy.svg
          theme: dark_lover
          max-rows: 1
          margin-width: 8
          margin-height: 8
          no-frame: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: push trophy.svg
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: trophy-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
