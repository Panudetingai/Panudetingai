name: Generate trophy

on:
  schedule:
    - cron: "0 0 * * *"   # ลดเป็นวันละครั้ง ลดโอกาสโดน rate limit
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write   # จำเป็นให้ step push ไป branch อื่นทำงานได้

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: debug - check token
        env:
          TROPHY_TOKEN: ${{ secrets.TROPHY_TOKEN }}
        run: |
          echo "token length = ${#TROPHY_TOKEN}"
          if [ -z "$TROPHY_TOKEN" ]; then
            echo "::error::secret is EMPTY in this run"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $TROPHY_TOKEN" https://api.github.com/user)
          echo "GitHub API status = $code (200 = token valid)"
    
      - name: generate trophy.svg
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: ${{ github.repository_owner }}
          file: dist/trophy.svg
          theme: dark_lover
          max-rows: 1
          margin-width: 8
          margin-height: 8
          no-frame: true
        env:
          GITHUB_TOKEN: ${{ secrets.TROPHY_TOKEN }}   # <--- ใช้ PAT แทน

      - name: push trophy.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: trophy-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
